<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                overflow: hidden;

                height: 100vh; /* Adjust as needed */
            }
            .the-ask{

                top: 0%;
                left: 30%;
                width: 40vw;

            }
            .heart1{
                position: absolute;
                top: 0%;
                left: 0%;

                height: auto;

            }

                top: 0%;
                left: 74%;
                width: 25vw;
                height: auto;
                z-index: 2;
            }
            .yes-button{
                position: relative;
                display: inline-block;
                padding: 50px 100px;

                text-decoration: none;
                border-radius: 500px;

            .no-button{

                left: 30%;

            }

        </style>
    </head>
    <body style="background-color:lightpink;">
        <div class="image-container">
